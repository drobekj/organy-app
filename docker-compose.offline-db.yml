name: organy-offline-db

services:
  offline-postgres:
    image: postgres:16-alpine
    container_name: organy-offline-postgres
    environment:
      POSTGRES_DB: organy_offline
      POSTGRES_USER: organy_offline
      POSTGRES_PASSWORD: organy_offline
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - organy_offline_postgres_data:/var/lib/postgresql/data
      - ./.organy-backups:/backups:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U organy_offline -d organy_offline"]
      interval: 2s
      timeout: 3s
      retries: 30

  pgweb:
    image: sosedoff/pgweb:0.17.0
    container_name: organy-offline-pgweb
    depends_on:
      offline-postgres:
        condition: service_healthy
    environment:
      PGWEB_DATABASE_URL: "postgres://organy_offline:organy_offline@offline-postgres:5432/organy_offline?sslmode=disable"
      PGWEB_LOCK_SESSION: "1"
    ports:
      - "127.0.0.1:8080:8081"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8081/"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  organy_offline_postgres_data:
