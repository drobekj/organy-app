name: Phase 31.28 Protected authentication acceptance

on:
  pull_request:
  push:
    branches:
      - codex/phase-31-28-protected-auth

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: organy_app
          POSTGRES_PASSWORD: organy_app
          POSTGRES_DB: organy_app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U organy_app -d organy_app"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://organy_app:organy_app@127.0.0.1:5432/organy_app
      BETTER_AUTH_SECRET: phase-31-28-ci-secret-long-enough-for-deterministic-acceptance
      BETTER_AUTH_URL: http://localhost:3000
      ORGANY_RUNTIME: db
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund --loglevel=error
      - name: Database migration
        run: npm run db:migrate
      - name: Typecheck
        run: npm run typecheck
      - name: Phase 31.28 auth acceptance
        if: ${{ hashFiles('scripts/phase-31-28-tests.ts') != '' }}
        env:
          ORGANY_BOOTSTRAP_ADMIN_PASSWORD: Phase31Admin!2026
          ORGANY_BOOTSTRAP_PRIEST_PASSWORD: Phase31Priest!2026
          ORGANY_BOOTSTRAP_ORGANIST_PASSWORD: Phase31Organist!2026
        run: npm run test:phase-31-28
      - name: Complete tests
        run: npm test
      - name: Production build
        run: npm run build
