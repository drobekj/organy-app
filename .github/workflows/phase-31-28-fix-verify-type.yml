name: Phase 31.28 verifier type fix

on:
  push:
    branches:
      - codex/phase-31-28-protected-staff-auth
    paths:
      - .github/workflows/phase-31-28-fix-verify-type.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/phase-31-28-protected-staff-auth
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/phase-31-28-fix-verify-type.mjs
      - run: npx tsc --noEmit
      - name: Commit verifier type fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Phase 31.4 verifier acceptance seam typing"
          git push origin HEAD:codex/phase-31-28-protected-staff-auth
