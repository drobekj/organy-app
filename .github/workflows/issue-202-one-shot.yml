name: Issue 202 one-shot fix

on:
  push:
    branches:
      - fix/issue-202-reference-topic-signal
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-202-reference-topic-signal
          fetch-depth: 0
      - name: Apply minimal fix and regression assertion
        shell: python
        run: |
          from pathlib import Path

          client_path = Path('app/planning-lifecycle-client.tsx')
          client = client_path.read_text()
          old = '''        referenceAntiphonId: referenceAntiphon?.id,
          antiphonKey: candidateAntiphonKey,'''
          new = '''        referenceAntiphonId: referenceAntiphon?.id,
          referenceTopicId: referenceTopic?.id,
          antiphonKey: candidateAntiphonKey,'''
          if client.count(old) != 1:
              raise SystemExit(f'Expected exactly one detail-eligibility omission, found {client.count(old)}')
          client_path.write_text(client.replace(old, new, 1))

          test_path = Path('scripts/phase-31-20-tests.tsx')
          test = test_path.read_text()
          anchor = '  assert.match(planning, /referenceTopicId: referenceTopic\\?\\.id/);\n'
          regression = '''  assert.match(
    planning,
    /async function loadDetailEligibility[\\s\\S]*?interactionClient\\.queryCandidates\\(\\{[\\s\\S]*?referenceAntiphonId: referenceAntiphon\\?\\.id,[\\s\\S]*?referenceTopicId: referenceTopic\\?\\.id,[\\s\\S]*?queryText: ""/,
    "Detail eligibility refresh must preserve the selected Reference Topic so season signals are not replaced with none.",
  );
'''
          if test.count(anchor) != 1:
              raise SystemExit(f'Expected one Phase 31.20 Topic assertion anchor, found {test.count(anchor)}')
          test_path.write_text(test.replace(anchor, anchor + regression, 1))
      - name: Remove one-shot workflow and commit exact fix scope
        run: |
          rm .github/workflows/issue-202-one-shot.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- app/planning-lifecycle-client.tsx scripts/phase-31-20-tests.tsx
          git rm --cached .github/workflows/issue-202-one-shot.yml >/dev/null 2>&1 || true
          git commit -m "Fix topic context in detail eligibility"
          git push origin HEAD:fix/issue-202-reference-topic-signal
