name: Phase 31.35 Vercel Neon runtime readiness acceptance

on:
  pull_request:
  push:
    branches:
      - codex/phase-31-35-vercel-neon-runtime-readiness

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: organy_app
          POSTGRES_PASSWORD: organy_app
          POSTGRES_DB: organy_app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U organy_app -d organy_app"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      ORGANY_RUNTIME: db
      DATABASE_URL: postgres://organy_app:organy_app@127.0.0.1:5432/organy_app
      BETTER_AUTH_SECRET: phase-31-35-ci-secret-randomized-baseline-0123456789
      BETTER_AUTH_URL: http://localhost:3000
      RESEND_API_KEY: re_ci_safe_placeholder
      CONGREGATION_EMAIL_FROM: Organy App <preferences@example.invalid>
      CONGREGATION_BASE_URL: http://localhost:3000
      CONGREGATION_SECURITY_SECRET: ci-congregation-security-secret-0123456789
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund --loglevel=error
      - name: Phase 31.35 runtime readiness acceptance
        run: npx tsx scripts/phase-31-35-tests.ts
      - name: Production-only dependency install smoke
        run: |
          rm -rf node_modules
          npm ci --omit=dev --ignore-scripts --no-audit --no-fund --loglevel=error
          node -e "require('pg'); console.log('production pg require: PASS')"
      - name: Restore complete dependencies
        run: npm ci --no-audit --no-fund --loglevel=error
      - name: Production runtime preflight regression
        run: npx tsx scripts/production-preflight.ts
      - name: Database migration regression
        run: npm run db:migrate
      - name: Typecheck
        run: npm run typecheck
      - name: Complete tests
        run: npm test
      - name: Production build
        run: npm run build
