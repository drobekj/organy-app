name: Reference melody edge acceptance

on:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: organy_app
          POSTGRES_PASSWORD: organy_app
          POSTGRES_DB: organy_issue_291
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U organy_app -d organy_issue_291"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      ORGANY_RUNTIME: db
      DATABASE_URL: postgres://organy_app:organy_app@127.0.0.1:5432/organy_issue_291
      DATABASE_URL_UNPOOLED: postgres://organy_app:organy_app@127.0.0.1:5432/organy_issue_291
      PHASE_31_43_ARCHIVE: _phase3143_contract_repo/data/handoff/phase-31-43-data-contract/church-organy-data-contract-definitive.zip
    steps:
      - name: Checkout implementation
        uses: actions/checkout@v4
      - name: Checkout definitive data contract
        uses: actions/checkout@v4
        with:
          ref: agent/phase-31-43-data-contract
          path: _phase3143_contract_repo
      - name: Verify definitive archive bytes
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum "$PHASE_31_43_ARCHIVE" | awk '{print $1}')" = "acd33d29aa07a6439b42fc3ebb973045c22781b2e1ec187139b71abeb3ee3be1"
          test "$(unzip -Z1 "$PHASE_31_43_ARCHIVE" | sort | tr '\n' '|')" = "A-melody-equivalence.json|B-jaroslav-repertoire-pivots.json|C-validation-report.json|HANDOFF.md|"
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund --loglevel=error
      - name: Materialize authoritative Reference catalogs
        run: node data/catalog/materialize-catalogs.mjs
      - name: Database migration
        run: npm run db:migrate
      - name: Establish exact Reference baseline
        run: npx tsx scripts/production-reference-sync.ts --apply
      - name: Persistent melody-edge acceptance
        run: npm run test:issue-291:db
      - name: Typecheck
        run: npm run typecheck
      - name: Complete tests
        run: npm test
