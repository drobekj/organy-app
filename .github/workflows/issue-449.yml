name: Idempotent temporary browser voter acceptance

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: organy_app
          POSTGRES_PASSWORD: organy_app
          POSTGRES_DB: organy_app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U organy_app -d organy_app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgres://organy_app:organy_app@127.0.0.1:5432/organy_app
      ORGANY_RUNTIME: db

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --loglevel=error

      - name: Database migration
        run: npm run db:migrate

      - name: Idempotent temporary voter acceptance
        run: npx tsx scripts/issue-449-tests.ts

      - name: Temporary voter regression
        run: npx tsx scripts/issue-435-static-tests.ts && npx tsx scripts/issue-435-db-tests.ts

      - name: Stable voter regression
        run: npm run test:issue-431

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build
