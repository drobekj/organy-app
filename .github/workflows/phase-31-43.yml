name: Phase 31.43 definitive knowledge handoff acceptance

on:
  pull_request:
  push:
    branches:
      - codex/phase-31-43-production-repertoire-handoff

jobs:
  inspect-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout implementation
        uses: actions/checkout@v4
      - name: Checkout definitive data contract
        uses: actions/checkout@v4
        with:
          ref: agent/phase-31-43-data-contract
          path: _phase3143_contract_repo
      - name: Inspect definitive archive shape
        shell: bash
        run: |
          set -euo pipefail
          archive="_phase3143_contract_repo/data/handoff/phase-31-43-data-contract/church-organy-data-contract-definitive.zip"
          actual_sha="$(sha256sum "$archive" | awk '{print $1}')"
          echo "ZIP_SHA256=$actual_sha"
          test "$actual_sha" = "acd33d29aa07a6439b42fc3ebb973045c22781b2e1ec187139b71abeb3ee3be1"
          rm -rf _phase3143_contract
          mkdir _phase3143_contract
          unzip -q "$archive" -d _phase3143_contract
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('_phase3143_contract')
          expected={'A-melody-equivalence.json','B-jaroslav-repertoire-pivots.json','C-validation-report.json','HANDOFF.md'}
          actual={p.name for p in root.iterdir()}
          print('MEMBERS=' + ','.join(sorted(actual)))
          assert actual == expected, (actual, expected)
          A=json.loads((root/'A-melody-equivalence.json').read_text(encoding='utf-8'))
          B=json.loads((root/'B-jaroslav-repertoire-pivots.json').read_text(encoding='utf-8'))
          C=json.loads((root/'C-validation-report.json').read_text(encoding='utf-8'))
          print('A.statistics=' + json.dumps(A['statistics'], ensure_ascii=False, sort_keys=True))
          print('A.reference_catalog=' + json.dumps(A['reference_catalog'], ensure_ascii=False, sort_keys=True))
          print('A.class.sample=' + json.dumps(A['classes'][0], ensure_ascii=False, sort_keys=True))
          print('A.member.keys=' + ','.join(sorted(A['classes'][0]['members'][0].keys())))
          print('A.provenance.keys=' + ','.join(sorted(A['classes'][0]['provenance_edges'][0].keys())))
          print('B.statistics=' + json.dumps(B['statistics'], ensure_ascii=False, sort_keys=True))
          print('B.pivot.sample=' + json.dumps(B['pivots'][0], ensure_ascii=False, sort_keys=True))
          print('C.checks=' + json.dumps(C['checks'], ensure_ascii=False, sort_keys=True))
          print('C.melody_class_statistics=' + json.dumps(C['melody_class_statistics'], ensure_ascii=False, sort_keys=True))
          print('C.repertoire_statistics=' + json.dumps(C['repertoire_statistics'], ensure_ascii=False, sort_keys=True))
          print('C.manual_polish_edge_orientation_cleanup=' + json.dumps(C['manual_polish_edge_orientation_cleanup'], ensure_ascii=False, sort_keys=True))
          PY
