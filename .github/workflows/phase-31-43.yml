name: Phase 31.43 definitive knowledge handoff acceptance

on:
  pull_request:
  push:
    branches:
      - codex/phase-31-43-production-repertoire-handoff

jobs:
  inspect-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout implementation
        uses: actions/checkout@v4
      - name: Checkout definitive data contract
        uses: actions/checkout@v4
        with:
          ref: agent/phase-31-43-data-contract
          path: _phase3143_contract_repo
      - name: Inspect definitive archive shape
        shell: bash
        run: |
          set -euo pipefail
          archive="_phase3143_contract_repo/data/handoff/phase-31-43-data-contract/church-organy-data-contract-definitive.zip"
          actual_sha="$(sha256sum "$archive" | awk '{print $1}')"
          echo "ZIP_SHA256=$actual_sha"
          test "$actual_sha" = "89edcf22f5603f51a4d1b27d94f8dfee4938a4fe4cfd3c950595d9bf4f0d1d54"
          rm -rf _phase3143_contract
          mkdir _phase3143_contract
          unzip -q "$archive" -d _phase3143_contract
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('_phase3143_contract')
          print('MEMBERS=' + ','.join(sorted(p.name for p in root.iterdir())))
          for name in ['A-melody-equivalence.json','B-jaroslav-repertoire-pivots.json','C-validation-report.json']:
              value=json.loads((root/name).read_text(encoding='utf-8'))
              print(f'{name}:TYPE={type(value).__name__}')
              if isinstance(value, dict):
                  print(f'{name}:KEYS=' + ','.join(sorted(value.keys())))
                  for k,v in value.items():
                      if isinstance(v,list):
                          print(f'{name}:{k}:LEN={len(v)}')
                          if v:
                              first=v[0]
                              print(f'{name}:{k}:FIRST_TYPE={type(first).__name__}')
                              if isinstance(first,dict): print(f'{name}:{k}:FIRST_KEYS=' + ','.join(sorted(first.keys())))
                      elif isinstance(v,dict):
                          print(f'{name}:{k}:DICT_KEYS=' + ','.join(sorted(v.keys())))
                      elif isinstance(v,(str,int,float,bool)) or v is None:
                          print(f'{name}:{k}:SCALAR={v}')
              elif isinstance(value,list):
                  print(f'{name}:LEN={len(value)}')
                  if value and isinstance(value[0],dict): print(f'{name}:FIRST_KEYS=' + ','.join(sorted(value[0].keys())))
          PY
