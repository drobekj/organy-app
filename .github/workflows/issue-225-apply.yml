name: Issue 225 guarded latency patch

on:
  push:
    branches: [fix/issue-225-db-latency]
    paths:
      - .github/workflows/issue-225-apply.yml
      - scripts/issue-225-apply.py
      - scripts/issue-225-fix-page.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-225-db-latency
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: python scripts/issue-225-apply.py
      - run: python scripts/issue-225-fix-page.py
      - run: npm install --save-exact @vercel/functions@3.9.5
      - run: npm run typecheck
      - run: npm test
      - name: Commit product patch and remove helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/issue-225-apply.yml scripts/issue-225-apply.py scripts/issue-225-fix-page.py
          git add -A
          git commit -m "Issue 225: reduce DB-backed interaction latency"
          git push origin HEAD:fix/issue-225-db-latency
