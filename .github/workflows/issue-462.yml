name: Congregation entry and mobile info dismissal acceptance

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --loglevel=error

      - name: Focused Issue 462 acceptance
        run: npx tsx scripts/issue-462-tests.ts

      - name: Temporary voter static regression
        run: npx tsx scripts/issue-435-static-tests.ts

      - name: Registered-email static regression
        run: npm run test:issue-431

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build
