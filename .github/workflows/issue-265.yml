name: Issue 265 concrete Plans and History row summaries

on:
  pull_request:
    paths:
      - src/planning-lifecycle/workspace.ts
      - scripts/issue-265-tests.ts
      - package.json
      - .github/workflows/issue-265.yml
  workflow_dispatch:

jobs:
  issue-265:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund --loglevel=error
      - name: Issue 265 concrete row summaries acceptance
        run: npm run test:issue-265
      - run: npm run typecheck
      - run: npm test
      - name: Production build
        run: npm run build
