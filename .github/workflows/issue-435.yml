name: Temporary congregation browser voter acceptance

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --loglevel=error

      - name: Temporary voter contract
        run: npx tsx scripts/issue-435-static-tests.ts

      - name: Stable voter regression contract
        run: npm run test:issue-431

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build
