name: Temporary guarded patch runner for issue 204

on:
  pull_request:

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'fix/issue-204-candidate-signal-visual' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: fix/issue-204-candidate-signal-visual
          fetch-depth: 0

      - name: Apply guarded presentation-only patch
        run: python scripts/issue-204-apply-patch.py

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --loglevel=error

      - name: Run focused compact candidate tests
        run: npx tsx scripts/phase-31-16-tests.tsx

      - name: Run focused melody detail tests
        run: npx tsx scripts/phase-31-17-tests.tsx

      - name: Typecheck
        run: npm run typecheck

      - name: Commit guarded fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/planning-lifecycle/candidate-list.tsx src/planning-lifecycle/melody-detail.tsx scripts/phase-31-16-tests.tsx scripts/phase-31-17-tests.tsx
          git diff --cached --check
          git commit -m "Fix compact candidate signal styling (#204)"
          git push origin HEAD:fix/issue-204-candidate-signal-visual
