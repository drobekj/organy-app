name: Issue 214 implementation patch

on:
  push:
    branches:
      - fix/issue-214-completed-truth-retro-identity
    paths:
      - .github/workflows/_issue214_patch.yml
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'fix/issue-214-completed-truth-retro-identity' || github.ref_name == 'fix/issue-214-completed-truth-retro-identity'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/issue-214-completed-truth-retro-identity
      - name: Apply patch
        run: |
          sed -i 's/) : ReferenceCandidateQueryResult\[\] {/): ReferenceCandidateQueryResult[] {/' scripts/_issue214_patch.py
          python scripts/_issue214_patch.py
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund --loglevel=error
      - name: Focused acceptance
        run: npx tsx scripts/issue-214-tests.ts
      - name: Typecheck
        run: npm run typecheck
      - name: Fast regression suite
        run: npm test
      - name: Production build
        run: npm run build
      - name: Commit implementation
        run: |
          rm scripts/_issue214_patch.py .github/workflows/_issue214_patch.yml
          git config user.name "drobekj"
          git config user.email "106076286+drobekj@users.noreply.github.com"
          git add -A
          git commit -m "Implement Completed historical truth and safe retroactive revisions"
          git push origin HEAD:fix/issue-214-completed-truth-retro-identity
