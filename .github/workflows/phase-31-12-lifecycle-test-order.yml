name: Phase 31.12 lifecycle test ordering

on:
  push:
    branches:
      - codex/phase-31-12-authoritative-candidates
    paths:
      - scripts/apply-phase-31-12-lifecycle-test-order.mjs
      - .github/workflows/phase-31-12-lifecycle-test-order.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/phase-31-12-authoritative-candidates
          fetch-depth: 0
      - run: node scripts/apply-phase-31-12-lifecycle-test-order.mjs
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/verify-phase-31-12.ts
          git commit -m "test: isolate candidate lifecycle mutation"
          git push origin HEAD:codex/phase-31-12-authoritative-candidates
