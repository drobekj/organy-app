name: Materialize Issue 210 source diff

on:
  push:
    branches:
      - refine/issue-210-product-workflow

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refine/issue-210-product-workflow
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply verified source changes once
        run: |
          python scripts/refine-210-patch.py
          python scripts/refine-210-onboarding-patch.py
          python scripts/refine-210-consistency-patch.py
          node <<'NODE'
          const fs = require('node:fs');
          const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          delete p.scripts.postinstall;
          p.scripts.test = p.scripts.test.replace(/\s*&&\s*node scripts\/refine-210-emit-patch\.mjs/g, '');
          if (!p.scripts.test.includes('scripts/product-refinement-210-tests.ts')) {
            p.scripts.test += ' && tsx scripts/product-refinement-210-tests.ts';
          }
          fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          NODE
          rm -f scripts/refine-210-patch.py scripts/refine-210-onboarding-patch.py scripts/refine-210-consistency-patch.py scripts/refine-210-emit-patch.mjs .github/workflows/refine-210-materialize.yml
      - name: Install clean tree
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Commit materialized verified diff
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Implement product refinement workflow (#210)"
          git push origin HEAD:refine/issue-210-product-workflow
