name: Issue 222 implementation runner

on:
  push:
    branches:
      - feat/issue-222-audit-history
    paths:
      - scripts/issue-222-implementation.py
      - scripts/issue-222-correction.py
      - .github/workflows/issue-222-implementation.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: organy_app
          POSTGRES_PASSWORD: organy_app
          POSTGRES_DB: organy_app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U organy_app -d organy_app"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://organy_app:organy_app@127.0.0.1:5432/organy_app
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: feat/issue-222-audit-history
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund --loglevel=error
      - name: Apply Issue 222 source patch
        run: python3 scripts/issue-222-implementation.py
      - name: Correct Issue 222 acceptance harness
        run: python3 scripts/issue-222-correction.py
      - name: Generate Drizzle migration
        run: npx drizzle-kit generate --name issue_222_audit_history
      - name: Apply migrations
        run: npm run db:migrate
      - name: Issue 222 acceptance
        run: npm run verify:issue-222
      - name: Typecheck
        run: npm run typecheck
      - name: Regression tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Commit verified implementation
        run: |
          rm scripts/issue-222-implementation.py
          rm scripts/issue-222-correction.py
          rm .github/workflows/issue-222-implementation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Implement append-only audit history (#222)"
          git push origin HEAD:feat/issue-222-audit-history
