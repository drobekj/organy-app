name: R74.4 temporary validation

on:
  push:
    branches:
      - r74-4-recover-production-baseline

jobs:
  publisher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python syntax
        run: python -m py_compile publish_fingering_pdfs.py
      - name: R74 publisher tests
        run: python -m unittest discover -s r74_tests -p 'test_*.py' -q
