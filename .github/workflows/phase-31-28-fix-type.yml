name: Phase 31.28 one-shot transport type fix

on:
  push:
    branches:
      - codex/phase-31-28-protected-auth

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/phase-31-28-protected-auth
      - name: Fix transport type
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/planning-lifecycle-client.tsx')
          s=p.read_text()
          old='type LocalActorRequest = { userId?: string; role?: PlanningRole };'
          new='type LocalActorRequest = { userId: string; role?: PlanningRole };'
          assert s.count(old)==1, s.count(old)
          p.write_text(s.replace(old,new))
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/planning-lifecycle-client.tsx
          git diff --cached --check
          git commit -m "Phase 31.28 preserve actor transport type"
          git push origin HEAD:codex/phase-31-28-protected-auth
