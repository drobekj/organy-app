name: Catalog candidate quick-jump acceptance

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --loglevel=error

      - name: Focused Issue 468 acceptance
        run: npx tsx scripts/issue-468-tests.ts

      - name: Catalog regression
        run: npx tsx scripts/catalog-tests.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build
