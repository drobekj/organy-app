name: Phase 31.24 UI transform runner

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  transform:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'codex/phase-31-24-conflict-safe-melody-window'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - run: node scripts/phase-31-24-ui-transform.mjs
      - name: Commit exact transform if needed
        run: |
          if git diff --quiet -- app/planning-lifecycle-client.tsx; then
            echo "Phase 31.24 UI transform already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/planning-lifecycle-client.tsx
          git commit -m "Wire Phase 31.24 Knowledge period control"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
