name: Issue 222 identity schema contract verifier

on:
  push:
    branches:
      - feat/issue-222-audit-history
    paths:
      - .github/workflows/issue-222-identity-schema-fix.yml

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: organy_app
          POSTGRES_PASSWORD: organy_app
          POSTGRES_DB: organy_phase_31_41
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U organy_app -d organy_phase_31_41"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      ORGANY_RUNTIME: db
      DATABASE_URL: postgresql://organy_app:organy_app@127.0.0.1:5432/organy_phase_31_41
      DATABASE_URL_UNPOOLED: postgresql://organy_app:organy_app@127.0.0.1:5432/organy_phase_31_41
      BETTER_AUTH_SECRET: issue-222-identity-schema-verifier-secret-0123456789
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/issue-222-audit-history
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund --loglevel=error
      - name: Patch reviewed identity schema contract
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          tables = '''const EXPECTED_PUBLIC_TABLES = [
            "antiphon_mappings",
            "app_user_roles",
            "app_users",
            "audit_events",
            "auth_accounts",
            "auth_sessions",
            "auth_users",
            "auth_verifications",
            "catalog_persons",
            "catalog_songs",
            "completed_service_rows",
            "completed_services",
            "liturgical_season_mappings",
            "melody_equivalence_classes",
            "melody_non_repetition_config",
            "organist_repertoire",
            "preference_profiles",
            "protected_account_actor_links",
            "reference_antiphon_recommendations",
            "reference_antiphons",
            "reference_catalog_songs",
            "reference_melody_classes",
            "reference_organist_repertoire",
            "reference_song_melody_memberships",
            "reference_song_preferences",
            "reference_thematic_parents",
            "reference_thematic_ranges",
            "reference_thematic_sections",
            "service_contexts",
            "service_set_rows",
            "service_sets",
            "song_melody_equivalence",
            "song_preferences",
          ].sort();'''
          p = Path("scripts/production-protected-identity-bootstrap.ts")
          s = p.read_text()
          s = s.replace('const EXPECTED_PUBLIC_TABLES = 32;', tables)
          s = s.replace('if (tables.length !== EXPECTED_PUBLIC_TABLES) {', 'if (!sameStrings(tables, EXPECTED_PUBLIC_TABLES)) {')
          s = s.replace('`Protected Production identity bootstrap requires the reviewed ${EXPECTED_PUBLIC_TABLES}-table Production schema.`', '`Protected Production identity bootstrap requires the reviewed ${EXPECTED_PUBLIC_TABLES.length}-table Production schema including the append-only audit boundary.`')
          s = s.replace('const MUST_REMAIN_EMPTY = new Set([\n  "auth_sessions",', 'const MUST_REMAIN_EMPTY = new Set([\n  "audit_events",\n  "auth_sessions",')
          if 'EXPECTED_PUBLIC_TABLES = 32' in s or 'tables.length !== EXPECTED_PUBLIC_TABLES' in s or 'reviewed ${EXPECTED_PUBLIC_TABLES}-table' in s:
              raise SystemExit('identity schema replacement incomplete')
          p.write_text(s)
          PY
      - name: Typecheck
        run: npm run typecheck
      - name: Materialize reference catalogs
        run: node data/catalog/materialize-catalogs.mjs
      - name: Database migration
        run: npm run db:migrate
      - name: Establish Production reference baseline
        run: npx tsx scripts/production-reference-sync.ts --apply
      - name: Phase 31.41 acceptance
        run: npx tsx scripts/phase-31-41-tests.ts
      - name: Commit verified identity contract update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/production-protected-identity-bootstrap.ts
          git commit -m "Update Production identity schema guard for audit history (#222)"
          git push origin HEAD:feat/issue-222-audit-history
