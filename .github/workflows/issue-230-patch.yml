name: Issue 230 guarded implementation patch

on:
  push:
    branches: [fix/issue-230-persistent-bidirectional-conflicts]
    paths:
      - scripts/issue-230-patch.py
      - .github/workflows/issue-230-patch.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: organy_issue_230_patch
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d organy_issue_230_patch"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/organy_issue_230_patch
      ORGANY_RUNTIME: db
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-230-persistent-bidirectional-conflicts
      - name: Apply guarded patch
        run: python scripts/issue-230-patch.py
      - name: Align Issue 230 source matchers
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/issue-230-tests.ts")
          text = path.read_text(encoding="utf-8")
          replacements = {
            'assert.match(clientSource, /completedInvalidationPreview\\.impactedPlans/, "Completed editor must render current authoritative conflict state, not only new deltas");':
              'assert.match(clientSource, /completedInvalidationPreview\\?\\.impactedPlans/, "Completed editor must render current authoritative conflict state, not only new deltas");',
            'assert.match(cssSource, /\\.saved-set-list button\\.needs-revision-record\\s*\\{[\\s\\S]*?outline:\\s*3px solid var\\(--danger\\)[\\s\\S]*?background:\\s*#fef3f2/);\n  assert.match(cssSource, /\\.needs-revision-row\\s*\\{[\\s\\S]*?outline:\\s*3px solid var\\(--danger\\)[\\s\\S]*?background:\\s*#fef3f2/);':
              'const recordAlarmRule = cssSource.match(/\\.saved-set-list button\\.needs-revision-record\\s*\\{([\\s\\S]*?)\\}/)?.[1] ?? "";\n  assert.match(recordAlarmRule, /outline:\\s*3px solid var\\(--danger\\)/);\n  assert.match(recordAlarmRule, /background:\\s*#fef3f2/);\n  const rowAlarmRule = cssSource.match(/\\.needs-revision-row\\s*\\{([\\s\\S]*?)\\}/)?.[1] ?? "";\n  assert.match(rowAlarmRule, /outline:\\s*3px solid var\\(--danger\\)/);\n  assert.match(rowAlarmRule, /background:\\s*#fef3f2/);',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f"Issue 230 matcher drifted: {old[:80]}")
              text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - name: Issue 224 regression
        run: npx tsx scripts/issue-224-tests.ts
      - name: Issue 225 regression
        run: npx tsx scripts/issue-225-tests.ts
      - name: Issue 230 DB and UI acceptance
        run: npx tsx scripts/issue-230-tests.ts
      - run: npm run typecheck
      - run: npm test
      - name: Commit product patch and remove staging helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app src scripts/issue-224-tests.ts scripts/issue-230-tests.ts .github/workflows/issue-230.yml
          git rm scripts/issue-230-patch.py .github/workflows/issue-230-patch.yml
          git commit -m "Issue 230: persist bidirectional conflict state"
          git push origin HEAD:fix/issue-230-persistent-bidirectional-conflicts
