name: Demo safety foundation acceptance

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: organy_app
          POSTGRES_PASSWORD: organy_app
          POSTGRES_DB: organy_app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U organy_app -d organy_app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgres://organy_app:organy_app@127.0.0.1:5432/organy_app
      ORGANY_RUNTIME: db
      BETTER_AUTH_SECRET: demo-safety-ci-secret-long-enough-for-protected-runtime-acceptance
      BETTER_AUTH_URL: http://127.0.0.1:3000
      RESEND_API_KEY: re_ci_safe_placeholder
      CONGREGATION_EMAIL_FROM: Organy App <preferences@example.invalid>
      CONGREGATION_BASE_URL: http://127.0.0.1:3000
      CONGREGATION_SECURITY_SECRET: ci-congregation-security-secret-0123456789
      ORGANY_BOOTSTRAP_ADMIN_PASSWORD: DemoD0Admin!2026
      ORGANY_BOOTSTRAP_PRIEST_PASSWORD: DemoD0Priest!2026
      ORGANY_BOOTSTRAP_ORGANIST_PASSWORD: DemoD0Organist!2026

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --loglevel=error

      - name: Database migration
        run: npm run db:migrate

      - name: Stage D0 pure safety contract
        run: npm run test:issue-402

      - name: Stage D0 protected API and write boundaries
        run: npm run test:issue-402:db

      - name: Stage D1 isolated runtime contract
        run: npm run test:issue-404

      - name: Stage D2 read-only Planning contract
        run: npm run test:issue-406

      - name: Stage D3 read-only Catalog knowledge contract
        run: npm run test:issue-408

      - name: Stage D4 presentation-only role simulation contract
        run: npm run test:issue-410

      - name: Stage D5 synthetic Admin and reset contract
        run: npm run test:issue-412

      - name: Existing Priest lifecycle regression
        run: npm run test:lifecycle

      - name: Existing Organist Melody Protection regression
        run: npm run test:issue-390

      - name: Typecheck
        run: npm run typecheck

      - name: Complete tests
        run: npm test

      - name: Standard Production build
        run: npm run build

      - name: Standard Production root still requires authentication
        shell: bash
        run: |
          set -euo pipefail
          npm run start -- --hostname 127.0.0.1 --port 3000 > d0-next.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for attempt in {1..30}; do
            if curl -sS -o /dev/null http://127.0.0.1:3000/sign-in; then
              break
            fi
            sleep 1
          done

          status="$(curl -sS -o /dev/null -D d0-root.headers -w '%{http_code}' http://127.0.0.1:3000/)"
          case "$status" in
            302|303|307|308) ;;
            *)
              echo "Expected unauthenticated Production root redirect, got HTTP $status"
              cat d0-root.headers
              exit 1
              ;;
          esac

          if ! tr -d '\r' < d0-root.headers | grep -qiE '^location: (https?://[^/]+)?/sign-in$'; then
            echo "Production root did not redirect to /sign-in"
            cat d0-root.headers
            exit 1
          fi

          kill "$server_pid"
          wait "$server_pid" 2>/dev/null || true
          trap - EXIT

      - name: Stage D1 secret-free Demo build
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .next
          env             -u DATABASE_URL             -u DATABASE_URL_UNPOOLED             -u POSTGRES_URL             -u POSTGRES_PRISMA_URL             -u BETTER_AUTH_SECRET             -u BETTER_AUTH_URL             -u CRON_SECRET             -u NEON_API_KEY             -u RESEND_API_KEY             -u CONGREGATION_EMAIL_FROM             -u CONGREGATION_BASE_URL             -u CONGREGATION_SECURITY_SECRET             ORGANY_EXPERIENCE=demo             ORGANY_RUNTIME=memory             npm run build

      - name: Stage D1 public Demo boot without secrets
        shell: bash
        run: |
          set -euo pipefail
          env             -u DATABASE_URL             -u DATABASE_URL_UNPOOLED             -u POSTGRES_URL             -u POSTGRES_PRISMA_URL             -u BETTER_AUTH_SECRET             -u BETTER_AUTH_URL             -u CRON_SECRET             -u NEON_API_KEY             -u RESEND_API_KEY             -u CONGREGATION_EMAIL_FROM             -u CONGREGATION_BASE_URL             -u CONGREGATION_SECURITY_SECRET             ORGANY_EXPERIENCE=demo             ORGANY_RUNTIME=memory             npm run start -- --hostname 127.0.0.1 --port 3100 > d1-next.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:3100/ -o d1-root.html; then
              break
            fi
            sleep 1
          done

          grep -F "Changes are temporary and are never saved." d1-root.html
          grep -F ">Planning<" d1-root.html
          grep -F ">Plans<" d1-root.html
          grep -F ">History<" d1-root.html
          grep -F ">Catalog<" d1-root.html
          grep -F "Preview role" d1-root.html
          grep -F "Presentation only · no sign-in or permissions are granted." d1-root.html
          grep -F "Reset Demo" d1-root.html
          grep -F "Save working plan" d1-root.html
          grep -F "disabled" d1-root.html

          if grep -qE 'Sign in|/api/' d1-root.html; then
            echo "Demo shell leaked protected-auth or API dependency markup."
            exit 1
          fi

          api_status="$(curl -sS -o d1-api.json -w '%{http_code}'             -H 'content-type: application/json'             -d '{"action":"listPeople","input":{},"actor":{"role":"admin"}}'             http://127.0.0.1:3100/api/catalog)"

          if [ "$api_status" != "400" ]; then
            echo "Expected Demo runtime protected DB API to remain disabled, got HTTP $api_status"
            cat d1-api.json
            exit 1
          fi

          grep -F "Catalog DB runtime is not enabled." d1-api.json

      - name: Upload Demo safety server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-safety-server-logs
          path: |
            d0-next.log
            d0-root.headers
            d1-next.log
            d1-root.html
            d1-api.json
          if-no-files-found: ignore
