name: Issue 306 Sign Role and Melody Protection polish

on:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout implementation
        uses: actions/checkout@v4
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund --loglevel=error
      - name: Visual polish acceptance
        run: npm run test:issue-306
      - name: Prior Sign Role acceptance
        run: npm run test:issue-304
      - name: Prior Melody Protection geometry acceptance
        run: npm run test:issue-302
      - name: Typecheck
        run: npm run typecheck
      - name: Complete tests
        run: npm test
      - name: Production build
        run: npm run build
