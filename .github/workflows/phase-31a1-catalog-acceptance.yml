name: Phase 31A1 catalog acceptance

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  catalog-acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund --loglevel=error
      - run: npm run verify:phase-31a1
