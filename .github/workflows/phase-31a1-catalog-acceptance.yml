name: Phase 31A1 catalog acceptance

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  catalog-acceptance:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: organy
          POSTGRES_PASSWORD: organy
          POSTGRES_DB: organy_phase31a1
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://organy:organy@localhost:5432/organy_phase31a1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node data/catalog/materialize-catalogs.mjs
      - run: npm run db:migrate
      - run: npm run db:reset:catalog-acceptance
      - run: npm run db:real-catalog-acceptance
      - run: npm run db:phase-30-1-smoke
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
