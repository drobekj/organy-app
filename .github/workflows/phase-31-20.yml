name: Phase 31.20 Topic acceptance

on:
  pull_request:

jobs:
  verify-topic:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: organy_app
          POSTGRES_PASSWORD: organy_app
          POSTGRES_DB: organy_app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U organy_app -d organy_app"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://organy_app:organy_app@127.0.0.1:5432/organy_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund --loglevel=error
      - name: Phase 31.20 focused acceptance
        run: |
          set -o pipefail
          npm run verify:phase-31-20 2>&1 | tee phase-31-20.log
      - name: Upload Phase 31.20 log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-31-20-log
          path: phase-31-20.log
          if-no-files-found: ignore
