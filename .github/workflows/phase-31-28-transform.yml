name: Phase 31.28 one-shot auth transform

on:
  push:
    branches:
      - codex/phase-31-28-protected-auth

permissions:
  contents: write

jobs:
  transform:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: codex/phase-31-28-protected-auth
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install current dependencies
        run: npm ci --no-audit --no-fund --loglevel=error
      - name: Pin compatible authentication stack
        run: npm install --save-exact --no-audit --no-fund --loglevel=error drizzle-orm@0.45.2 better-auth@1.6.25 @better-auth/drizzle-adapter@1.6.25
      - name: Correct explicit shared transform target
        run: node scripts/phase-31-28-fix-transform.mjs
      - name: Apply Phase 31.28 transform
        run: node scripts/phase-31-28-transform.mjs
      - name: Generate Drizzle migration
        run: npm run db:generate
      - name: Commit generated implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package.json package-lock.json src/db/schema/index.ts app/planning-lifecycle-client.tsx app/api/interaction/route.ts app/globals.css docs/phase-31-28-contract.md drizzle
          git diff --cached --check
          git commit -m "Phase 31.28 generate protected auth schema and client integration"
          git push origin HEAD:codex/phase-31-28-protected-auth
