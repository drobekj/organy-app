name: Phase 31.28 implementation transform

on:
  push:
    branches:
      - codex/phase-31-28-protected-staff-auth
    paths:
      - .github/workflows/phase-31-28-implement.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/phase-31-28-protected-staff-auth
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/phase-31-28-implement.mjs
      - name: Commit implementation baseline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement Phase 31.28 protected staff auth baseline"
          git push origin HEAD:codex/phase-31-28-protected-staff-auth
      # retry 2: helper syntax fixed
