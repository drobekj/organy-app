name: Issue 257 Audit History ordering and no-op acceptance

on:
  pull_request:
    paths:
      - app/admin/audit-history/page.tsx
      - app/api/planning-lifecycle/route.ts
      - app/issue-253-audit-history.css
      - src/application/audit-history-view.ts
      - src/application/planning-change-attribution.ts
      - scripts/issue-255-tests.ts
      - scripts/issue-257-tests.ts
      - package.json
      - .github/workflows/issue-257.yml
  workflow_dispatch:

jobs:
  issue-257:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund --loglevel=error
      - name: Issue 257 ordering/no-op acceptance
        run: npm run test:issue-257
      - run: npm run typecheck
      - run: npm test
      - name: Production build
        run: npm run build
