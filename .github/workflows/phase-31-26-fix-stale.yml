name: Phase 31.26 stale documentation fix

on:
  push:
    branches:
      - codex/phase-31-26-audit-policy
    paths:
      - .github/workflows/phase-31-26-fix-stale.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/phase-31-26-audit-policy
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/phase-31-26-fix-stale.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/architecture.md
          git diff --cached --check
          git commit -m "Phase 31.26 — align architecture with 31.25"
          git push origin HEAD:codex/phase-31-26-audit-policy
