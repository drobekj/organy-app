name: Phase 31.28 source-of-truth sync

on:
  push:
    branches:
      - codex/phase-31-28-protected-staff-auth
    paths:
      - .github/workflows/phase-31-28-doc-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/phase-31-28-protected-staff-auth
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/phase-31-28-doc-sync.mjs
      - name: Commit source-of-truth alignment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Align Phase 31.28 authentication source of truth"
          git push origin HEAD:codex/phase-31-28-protected-staff-auth
