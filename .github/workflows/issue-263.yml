name: Issue 263 Plans and History row summary acceptance

on:
  pull_request:
    paths:
      - src/planning-lifecycle/row-summary.ts
      - src/planning-lifecycle/workspace.ts
      - src/application/audit-history-view.ts
      - scripts/issue-263-tests.ts
      - package.json
      - .github/workflows/issue-263.yml
  workflow_dispatch:

jobs:
  issue-263:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund --loglevel=error
      - name: Issue 263 row-summary acceptance
        run: npm run test:issue-263
      - run: npm run typecheck
      - run: npm test
      - name: Production build
        run: npm run build
