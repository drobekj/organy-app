name: Issue 237 matcher patch

on:
  push:
    branches:
      - feat/issue-237-songs-melodies

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/issue-237-songs-melodies
          fetch-depth: 0
      - name: Update stale Phase 31.17 matcher
        shell: python
        run: |
          from pathlib import Path
          path = Path("scripts/phase-31-17-tests.tsx")
          text = path.read_text()
          old = r"setDetailReturnCandidates\(\[\.\.\.visibleCandidates\]\)"
          new = r"setDetailReturnCandidates\(\[\.\.\.rawVisibleCandidates\]\)"
          if text.count(old) != 1:
              raise SystemExit(f"Expected exactly one stale matcher, found {text.count(old)}")
          path.write_text(text.replace(old, new))
      - name: Commit corrected matcher and remove helper
        run: |
          git rm .github/workflows/issue-237-matcher-patch.yml
          git add scripts/phase-31-17-tests.tsx
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update Phase 31.17 matcher for candidate views"
          git push origin HEAD:feat/issue-237-songs-melodies
