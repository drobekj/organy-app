name: Stable congregation voter identity acceptance

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: organy_app
          POSTGRES_PASSWORD: organy_app
          POSTGRES_DB: organy_app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U organy_app -d organy_app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgres://organy_app:organy_app@127.0.0.1:5432/organy_app
      ORGANY_RUNTIME: db
      BETTER_AUTH_SECRET: issue-431-ci-better-auth-secret-0123456789
      BETTER_AUTH_URL: http://localhost:3000
      RESEND_API_KEY: re_ci_safe_placeholder
      CONGREGATION_EMAIL_FROM: Organy App <preferences@example.invalid>
      CONGREGATION_BASE_URL: http://localhost:3000
      CONGREGATION_SECURITY_SECRET: issue-431-ci-congregation-secret-0123456789

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --loglevel=error

      - name: Database migration
        run: npm run db:migrate

      - name: Static voter contract
        run: npm run test:issue-431

      - name: Stable voter database acceptance
        run: npm run test:issue-431:db

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build
