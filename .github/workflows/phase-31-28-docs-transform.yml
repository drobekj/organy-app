name: Phase 31.28 one-shot source-of-truth auth update

on:
  push:
    branches:
      - codex/phase-31-28-protected-auth

permissions:
  contents: write

jobs:
  transform:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/phase-31-28-protected-auth
      - name: Update source of truth
        run: node scripts/phase-31-28-docs-transform.mjs
      - name: Commit docs
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/production-auth-decision.md docs/auth-account-role-model.md docs/backlog.md docs/roadmap.md docs/implementation-preparation.md
          git diff --cached --check
          git commit -m "Phase 31.28 align authentication source of truth"
          git push origin HEAD:codex/phase-31-28-protected-auth
