name: Phase 31.38 first production Neon schema migration acceptance

on:
  pull_request:
  push:
    branches:
      - codex/phase-31-38-first-production-neon-schema-migration

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: organy_app
          POSTGRES_PASSWORD: organy_app
          POSTGRES_DB: organy_first_migration
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U organy_app -d organy_first_migration"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      ORGANY_RUNTIME: db
      DATABASE_URL: postgres://organy_app:organy_app@127.0.0.1:5432/organy_first_migration
      DATABASE_URL_UNPOOLED: postgres://organy_app:organy_app@127.0.0.1:5432/organy_first_migration
      BETTER_AUTH_SECRET: phase-31-38-ci-secret-randomized-baseline-0123456789
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund --loglevel=error
      - name: Phase 31.38 first migration boundary acceptance
        run: npx tsx scripts/phase-31-38-tests.ts
      - name: Phase 31.37 provider boundary regression
        run: npx tsx scripts/phase-31-37-tests.ts
      - name: Phase 31.36 Neon provider regression
        run: npx tsx scripts/phase-31-36-tests.ts
      - name: Full production runtime preflight remains strict
        run: npx tsx scripts/production-preflight.ts
      - name: Database migration idempotence regression
        run: npm run db:migrate
      - name: Typecheck
        run: npm run typecheck
      - name: Complete tests
        run: npm test
      - name: Production build
        run: npm run build
