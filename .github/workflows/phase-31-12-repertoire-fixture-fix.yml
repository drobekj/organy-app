name: Phase 31.12 repertoire fixture correction

on:
  push:
    branches:
      - codex/phase-31-16-concrete-candidate-list-ui
    paths:
      - scripts/phase-31-12-repertoire-fixture-fix.mjs
      - .github/workflows/phase-31-12-repertoire-fixture-fix.yml

permissions:
  contents: write

jobs:
  correct:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: organy_app
          POSTGRES_PASSWORD: organy_app
          POSTGRES_DB: organy_app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U organy_app -d organy_app"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://organy_app:organy_app@127.0.0.1:5432/organy_app
    steps:
      - name: Checkout correction branch
        uses: actions/checkout@v4
        with:
          ref: codex/phase-31-16-concrete-candidate-list-ui
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply fixture correction
        run: node scripts/phase-31-12-repertoire-fixture-fix.mjs
      - name: Install dependencies
        run: npm ci --no-audit --no-fund --loglevel=error
      - name: Wait for PostgreSQL
        run: |
          for attempt in {1..30}; do
            if docker exec ${{ job.services.postgres.id }} pg_isready -U organy_app -d organy_app; then
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Verify corrected Phase 31.12 fixture
        run: npm run verify:phase-31-12
      - name: Remove correction bootstrap and commit verified fixture
        run: |
          rm scripts/phase-31-12-repertoire-fixture-fix.mjs
          rm .github/workflows/phase-31-12-repertoire-fixture-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Align Phase 31.12 fixture with repertoire hard filter"
          git push origin HEAD:codex/phase-31-16-concrete-candidate-list-ui
