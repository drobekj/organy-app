name: Issue 212 acceptance fixes

on:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund --loglevel=error
      - name: Issue 212 acceptance regression
        run: npx tsx scripts/issue-212-acceptance-tests.ts
      - name: Typecheck
        run: npm run typecheck
