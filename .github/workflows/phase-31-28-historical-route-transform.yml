name: Phase 31.28 one-shot historical protected-route test adaptation

on:
  push:
    branches:
      - codex/phase-31-28-protected-auth

permissions:
  contents: write

jobs:
  transform:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/phase-31-28-protected-auth
      - name: Adapt historical route tests
        run: node scripts/phase-31-28-historical-route-transform.mjs
      - name: Commit adapted tests
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/verify-phase-31-5.ts scripts/verify-phase-31-6.ts scripts/verify-phase-31-7.ts scripts/verify-phase-31-8.ts scripts/verify-phase-31-10a.ts scripts/verify-phase-31-11.ts scripts/verify-phase-31-12.ts
          git diff --cached --check
          git commit -m "Phase 31.28 preserve historical protected-route regressions"
          git push origin HEAD:codex/phase-31-28-protected-auth
