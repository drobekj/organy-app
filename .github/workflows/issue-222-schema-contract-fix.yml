name: Issue 222 schema contract verifier

on:
  push:
    branches:
      - feat/issue-222-audit-history
    paths:
      - .github/workflows/issue-222-schema-contract-fix.yml

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: organy_app
          POSTGRES_PASSWORD: organy_app
          POSTGRES_DB: organy_phase_31_39
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U organy_app -d organy_phase_31_39"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://organy_app:organy_app@127.0.0.1:5432/organy_phase_31_39
      DATABASE_URL_UNPOOLED: postgresql://organy_app:organy_app@127.0.0.1:5432/organy_phase_31_39
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/issue-222-audit-history
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund --loglevel=error
      - name: Patch reviewed 33-table contract
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          tables = '''const EXPECTED_PUBLIC_TABLES = [
            "antiphon_mappings",
            "app_user_roles",
            "app_users",
            "audit_events",
            "auth_accounts",
            "auth_sessions",
            "auth_users",
            "auth_verifications",
            "catalog_persons",
            "catalog_songs",
            "completed_service_rows",
            "completed_services",
            "liturgical_season_mappings",
            "melody_equivalence_classes",
            "melody_non_repetition_config",
            "organist_repertoire",
            "preference_profiles",
            "protected_account_actor_links",
            "reference_antiphon_recommendations",
            "reference_antiphons",
            "reference_catalog_songs",
            "reference_melody_classes",
            "reference_organist_repertoire",
            "reference_song_melody_memberships",
            "reference_song_preferences",
            "reference_thematic_parents",
            "reference_thematic_ranges",
            "reference_thematic_sections",
            "service_contexts",
            "service_set_rows",
            "service_sets",
            "song_melody_equivalence",
            "song_preferences",
          ].sort();'''

          p = Path("scripts/production-reference-sync.ts")
          s = p.read_text()
          s = s.replace('const EXPECTED_PUBLIC_TABLES = 32;', tables)
          s = s.replace('`Production reference synchronization requires the reviewed ${EXPECTED_PUBLIC_TABLES}-table Phase 31.38 schema.`', '`Production reference synchronization requires the reviewed ${EXPECTED_PUBLIC_TABLES.length}-table schema including the append-only audit boundary.`')
          s = s.replace('if (boundary.publicTables.length !== EXPECTED_PUBLIC_TABLES) {\n    throw new Error(`Production reference synchronization requires the reviewed ${EXPECTED_PUBLIC_TABLES}-table Phase 31.38 schema.`);\n  }', 'if (!sameStrings(boundary.publicTables, EXPECTED_PUBLIC_TABLES)) {\n    throw new Error(`Production reference synchronization requires the reviewed ${EXPECTED_PUBLIC_TABLES.length}-table schema including the append-only audit boundary.`);\n  }')
          if 'EXPECTED_PUBLIC_TABLES = 32' in s or 'reviewed ${EXPECTED_PUBLIC_TABLES}-table' in s:
              raise SystemExit('production sync replacement incomplete')
          p.write_text(s)

          p = Path("scripts/phase-31-39-tests.ts")
          s = p.read_text()
          marker = 'const CONFIG_TABLE = "melody_non_repetition_config";'
          s = s.replace(marker, marker + '\n' + tables)
          s = s.replace('assert.equal((await publicTables(pool)).length, 32, "Phase 31.39 must start from the exact reviewed 32-table Phase 31.38 schema");', 'assert.deepEqual(await publicTables(pool), EXPECTED_PUBLIC_TABLES, "Phase 31.39 must start from the exact reviewed 33-table schema including audit_events");')
          s = s.replace('assert.deepEqual(await nonEmptyPublicTables(pool), EXPECTED_NON_EMPTY);', 'assert.deepEqual(await nonEmptyPublicTables(pool), EXPECTED_NON_EMPTY);\n    assert.equal(Number((await pool.query("select count(*)::int n from audit_events")).rows[0].n), 0, "reference synchronization must never write audit_events");')
          if 'exact reviewed 32-table' in s:
              raise SystemExit('phase 31.39 replacement incomplete')
          p.write_text(s)
          PY
      - name: Typecheck
        run: npm run typecheck
      - name: Phase 31.39 acceptance
        run: npx tsx scripts/phase-31-39-tests.ts
      - name: Commit verified contract update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/production-reference-sync.ts scripts/phase-31-39-tests.ts
          git commit -m "Update Production reference schema guard for audit history (#222)"
          git push origin HEAD:feat/issue-222-audit-history
