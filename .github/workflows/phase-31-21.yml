name: Phase 31.21 minimal Service Context acceptance

on:
  pull_request:
    branches:
      - codex/phase-31-20-service-topic
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund --loglevel=error
      - name: Phase 31.21 minimal Service Context layout
        run: node scripts/phase-31-21-tests.mjs
      - name: Phase 31.20 regression
        run: npm run test:phase-31-20
      - name: Typecheck
        run: npm run typecheck
      - name: Complete tests
        run: npm test
      - name: Production build
        run: npm run build
