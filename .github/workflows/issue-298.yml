name: Issue 298 Stage 6 symmetric refinement

on:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout implementation
        uses: actions/checkout@v4
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Symmetric refinement acceptance
        run: npm run test:issue-298
      - name: Prior Catalog layout acceptance
        run: npm run test:issue-296
      - name: Stage 6 functional acceptance
        run: npm run test:issue-293
      - name: Songs-derived Melodies invariant
        run: npm run test:issue-242
      - name: Typecheck
        run: npm run typecheck
      - name: Complete tests
        run: npm test
      - name: Production build
        run: npm run build
