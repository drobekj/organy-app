name: Phase 31.17 isolated final refinement

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: phase-31-17-isolated-final-refinement
  cancel-in-progress: true

jobs:
  refine:
    if: github.head_ref == 'codex/phase-31-17-compact-row-runner'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/phase-31-17-compact-row-runner
          fetch-depth: 0
      - name: Preserve refinement script and switch to product branch
        run: |
          cp scripts/phase-31-17-final-refinement.py /tmp/phase-31-17-final-refinement.py
          git fetch origin codex/phase-31-17-inline-melody-detail
          git switch --force-create codex/phase-31-17-inline-melody-detail origin/codex/phase-31-17-inline-melody-detail
          test "$(git rev-parse HEAD)" = "fdc9cafa41778c4ebec6462f2b873ba6de707746"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund --loglevel=error
      - name: Apply approved final refinement
        run: python3 /tmp/phase-31-17-final-refinement.py
      - name: Focused Phase 31.17 acceptance
        run: npm run test:phase-31-17
      - name: Typecheck
        run: npm run typecheck
      - name: Complete tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Commit verified refinement to PR branch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            app/globals.css \
            app/planning-lifecycle-client.tsx \
            docs/phase-31-17-contract.md \
            scripts/phase-31-17-tests.tsx \
            scripts/planning-ui-workflow-static-tests.ts \
            src/planning-lifecycle/candidate-list.tsx
          git diff --cached --check
          git commit -m "Phase 31.17 — finalize candidate focus and action validation"
          git push origin HEAD:codex/phase-31-17-inline-melody-detail
