name: Issue 312 Audit retention dry-run

on:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: organy_app
          POSTGRES_USER: organy_app
          POSTGRES_PASSWORD: organy_app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U organy_app -d organy_app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://organy_app:organy_app@localhost:5432/organy_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund --loglevel=error
      - run: npm run db:migrate
      - name: Audit retention dry-run acceptance
        run: npm run test:issue-312
      - name: Prior finalization handoff acceptance
        run: npm run test:issue-310
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
