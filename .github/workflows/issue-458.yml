name: Selected-organist Melody Protection acceptance

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      ORGANY_RUNTIME: memory
      BETTER_AUTH_SECRET: issue-458-ci-better-auth-secret-0123456789
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --loglevel=error

      - name: Issue 458 acceptance
        run: npx tsx scripts/issue-458-tests.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build
