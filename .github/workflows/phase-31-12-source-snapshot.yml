name: Phase 31.12 source snapshot

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: phase-31-12-source
          path: |
            .
            !.git
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
