name: Phase 31.16 final review fix

on:
  push:
    branches:
      - codex/phase-31-16-concrete-candidate-list-ui

permissions:
  contents: write

jobs:
  correct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply final review corrections
        run: python scripts/phase-31-16-final-review-fix.py
      - name: Install dependencies
        run: npm ci --no-audit --no-fund --loglevel=error
      - name: Focused acceptance
        run: npm run test:phase-31-16
      - name: Typecheck
        run: npm run typecheck
      - name: Existing tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Commit corrected implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Phase 31.16: finalize list focus and option semantics"
          git push origin HEAD:codex/phase-31-16-concrete-candidate-list-ui
