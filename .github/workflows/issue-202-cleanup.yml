name: Issue 202 cleanup

on:
  push:
    branches:
      - fix/issue-202-reference-topic-signal

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-202-reference-topic-signal
          fetch-depth: 0
      - name: Remove unrelated whitespace diff and self-delete
        shell: python
        run: |
          from pathlib import Path
          path = Path('app/planning-lifecycle-client.tsx')
          text = path.read_text()
          old = '...(input.organistPersonId ? { organistPersonId: input.organistPersonId } : {}) , active: input.active'
          new = '...(input.organistPersonId ? { organistPersonId: input.organistPersonId } : {}), active: input.active'
          if text.count(old) != 1:
              raise SystemExit(f'Expected one unrelated whitespace diff, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          Path('.github/workflows/issue-202-cleanup.yml').unlink()
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- app/planning-lifecycle-client.tsx
          git rm --cached .github/workflows/issue-202-cleanup.yml >/dev/null 2>&1 || true
          git commit -m "Scrub Issue 202 PR scope"
          git push origin HEAD:fix/issue-202-reference-topic-signal
