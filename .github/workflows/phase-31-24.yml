name: Phase 31.24 Non-repetition period acceptance

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: organy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d organy"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/organy
      ORGANY_RUNTIME: db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund --loglevel=error
      - name: Database migration
        run: npm run db:migrate
      - name: Phase 31.24 conflict-safe period acceptance
        run: npx tsx scripts/phase-31-24-tests.ts
      - name: Phase 31.24 Knowledge UI acceptance
        run: node scripts/phase-31-24-ui-tests.mjs
      - name: Phase 31.23 typography regression
        run: node scripts/phase-31-23-tests.mjs
      - name: Phase 31.22 interaction regression
        run: npx tsx scripts/phase-31-22-tests.tsx
      - name: Phase 31.21 presentation regression
        run: node scripts/phase-31-21-tests.mjs
      - name: Phase 31.20 behavior regression
        run: npm run test:phase-31-20
      - name: Typecheck
        run: npm run typecheck
      - name: Complete tests
        run: npm test
      - name: Production build
        run: npm run build
