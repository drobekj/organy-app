name: Issue 242 Songs-derived Melodies class subset

on:
  pull_request:
    paths:
      - src/application/reference-candidate-service.ts
      - src/planning-lifecycle/candidate-view.ts
      - scripts/issue-237-tests.ts
      - scripts/issue-240-tests.ts
      - scripts/issue-242-tests.ts
      - package.json
      - package-lock.json
      - .github/workflows/issue-242.yml
  workflow_dispatch:

jobs:
  issue-242:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund --loglevel=error
      - name: Songs-derived Melodies class subset
        run: npm run test:issue-242
      - run: npm run typecheck
      - run: npm test
      - name: Production build
        run: npm run build
