name: Phase 31.27 corrected policy rewrite fix

on:
  push:
    branches:
      - codex/phase-31-27-production-auth-decision
    paths:
      - scripts/phase-31-27-policy-rewrite-fix.mjs
      - .github/workflows/phase-31-27-policy-rewrite-fix.yml

permissions:
  contents: write

jobs:
  rewrite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/phase-31-27-production-auth-decision
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rewrite corrected Phase 31.27 policy
        run: node scripts/phase-31-27-policy-rewrite-fix.mjs
      - name: Commit corrected documentation and remove temporary helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/architecture.md docs/auth-account-role-model.md docs/implementation-preparation.md docs/phase-31-27-contract.md docs/production-auth-decision.md docs/roadmap.md
          git rm scripts/phase-31-27-policy-rewrite.mjs scripts/phase-31-27-policy-rewrite-fix.mjs .github/workflows/phase-31-27-policy-rewrite.yml .github/workflows/phase-31-27-policy-rewrite-fix.yml
          git commit -m "Align Phase 31.27 with credential and nickname access model"
          git push origin HEAD:codex/phase-31-27-production-auth-decision
