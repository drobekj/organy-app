name: Issue 224 pre-deploy acceptance

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  issue-224:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: organy_issue_224
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d organy_issue_224"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/organy_issue_224
      ORGANY_RUNTIME: db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - name: Issue 224 DB and UI acceptance
        run: npx tsx scripts/issue-224-tests.ts
      - run: npm run typecheck
      - run: npm test
