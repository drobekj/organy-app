name: Phase 31.12 verifier alignment

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]' && github.event.pull_request.head.ref == 'codex/phase-31-12-authoritative-candidates'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply verifier alignment
        run: |
          set -euo pipefail
          git apply --index .phase-31-12-fix.patch
          rm -f .phase-31-12-fix.patch .github/workflows/phase-31-12-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Align Phase 31.8 verifier with authoritative candidate melody activation"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
