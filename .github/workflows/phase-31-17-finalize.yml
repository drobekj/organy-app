name: Phase 31.17 final clean tree

on:
  push:
    branches:
      - codex/phase-31-17-inline-melody-detail

permissions:
  contents: write

concurrency:
  group: phase-31-17-final-clean-tree
  cancel-in-progress: true

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/phase-31-17-inline-melody-detail
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund --loglevel=error
      - name: Build final clean Phase 31.17 tree
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          def replace_once_or_aligned(path_name: str, old: str, new: str) -> None:
              path = Path(path_name)
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count == 1:
                  text = text.replace(old, new, 1)
              elif new not in text:
                  raise RuntimeError(f"{path_name}: expected stale or aligned text, stale count={count}")
              path.write_text(text, encoding="utf-8")

          def replace_if_present(path_name: str, old: str, new: str) -> None:
              path = Path(path_name)
              text = path.read_text(encoding="utf-8").replace(old, new)
              path.write_text(text, encoding="utf-8")

          replace_once_or_aligned(
              "src/planning-lifecycle/candidate-flow.ts",
              '  return `${song.number}${song.title ? ` — ${song.title}` : ""}`;',
              '  return `${song.number}${song.title ? ` · ${song.title}` : ""}`;',
          )
          replace_once_or_aligned(
              "scripts/phase-31-12-tests.tsx",
              "  assert.equal((client.match(/data-candidate-line|<CandidateLine/g) ?? []).length > 0, true);",
              '  assert.equal((client.match(/data-candidate-line|<CandidateLine/g) ?? []).length, 0);\n  assert.match(client, /className="row-icon-palette"/);',
          )
          replace_once_or_aligned("scripts/phase-31-17-tests.tsx", '"29 — Czech song"', '"29 · Czech song"')
          for filename in ["scripts/phase-31-16-tests.tsx", "scripts/phase-30-1-candidate-flow-tests.ts"]:
              replace_if_present(filename, "29 — Current", "29 · Current")
              replace_if_present(filename, "421 — Equivalent", "421 · Equivalent")
              replace_if_present(filename, "101 — Visible", "101 · Visible")
          replace_once_or_aligned(
              "docs/phase-31-17-contract.md",
              "- after selection, the collapsed song field contains only the concrete song number and title;",
              "- after selection, the collapsed song field contains only `number · title`;",
          )
          replace_once_or_aligned(
              "docs/candidate-selection-knowledge-transfer.md",
              "- the selected song field shows only concrete number and title;",
              "- the selected song field shows only `number · title`;",
          )

          package_path = Path("package.json")
          package = json.loads(package_path.read_text(encoding="utf-8"))
          package["scripts"]["verify:phase-31-17"] = "npm run test:phase-31-17 && npm run verify:phase-31-16"
          package_path.write_text(json.dumps(package, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          temporary_paths = [
              ".github/workflows/phase-31-17-review.yml",
              ".github/workflows/phase-31-17-row-ux.yml",
              ".github/workflows/phase-31-17-finalize.yml",
              "docs/.phase-31-17-runner-ready",
              "docs/.phase-31-17-runner-state",
              "docs/.phase-31-17-runner-trigger",
              "docs/phase-31-17-execution-note.md",
              "scripts/phase-31-17-ci-apply.py",
              "scripts/phase-31-17-review-fix.py",
              "scripts/phase-31-17-row-ux-fix.py",
              "scripts/phase-31-17-row-ux-test-fix.py",
              "scripts/sitecustomize.py",
          ]
          for path_name in temporary_paths:
              Path(path_name).unlink(missing_ok=True)

          print("Final clean Phase 31.17 tree prepared.")
          PY
      - name: Focused Phase 31.17 acceptance
        run: npm run test:phase-31-17
      - name: Superseded Phase 31.12 boundary acceptance
        run: npx tsx scripts/phase-31-12-tests.tsx
      - name: Typecheck
        run: npm run typecheck
      - name: Complete tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Commit final clean tree
        run: |
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Phase 31.17 — finalize compact Planning row"
          git push origin HEAD:codex/phase-31-17-inline-melody-detail
