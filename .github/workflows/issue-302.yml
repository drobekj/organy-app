name: Issue 302 Melody Protection geometry

on:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout implementation
        uses: actions/checkout@v4
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund --loglevel=error
      - name: Geometry regression acceptance
        run: npm run test:issue-302
      - name: Prior Planning header/alert acceptance
        run: npm run test:issue-300
      - name: Stage 6 refinement acceptance
        run: npm run test:issue-298
      - name: Typecheck
        run: npm run typecheck
      - name: Complete tests
        run: npm test
      - name: Production build
        run: npm run build
