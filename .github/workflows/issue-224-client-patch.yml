name: Issue 224 guarded client patch

on:
  push:
    branches:
      - fix/issue-224-predeploy-conflict-role-history
    paths:
      - .github/workflows/issue-224-client-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-224-predeploy-conflict-role-history
          fetch-depth: 0
      - name: Apply corrected exact guarded patches
        run: |
          python scripts/issue-224-patch-script-fix.py
          python scripts/issue-224-client-patch.py
      - name: Verify patch markers
        run: |
          grep -q 'previewCompletedRecordInvalidation' app/planning-lifecycle-client.tsx
          grep -q 'needs-revision-row' app/planning-lifecycle-client.tsx
          grep -q 'history-scroll-list' app/planning-lifecycle-client.tsx
          grep -q 'serializeActiveRoleCookie' app/planning-lifecycle-client.tsx
          grep -q 'completed-invalidation-warning' app/globals.css
      - name: Commit patched client and remove helpers
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/issue-224-client-patch.yml scripts/issue-224-client-patch.py scripts/issue-224-patch-script-fix.py
          git add app/planning-lifecycle-client.tsx app/globals.css
          git commit -m "Issue 224: fix conflict signals, role persistence and history UX"
          git push origin HEAD:fix/issue-224-predeploy-conflict-role-history
