          <div className="error-summary completed-invalidation-warning" role="alert">
            <strong>Saving this historical correction will require confirmation because active plans would be invalidated or marked for revision.</strong>
            <ul>{completedInvalidationPreview.newlyImpactedPlans.map((impact) => <li key={impact.planId}>{impact.reason}</li>)}</ul>
          </div>
        )}

        {workspace === "plans" && (''',
              'immediate completed alert',
          )
          replace_once(
              '''          <section className="db-workspace" aria-label="Plans">
            <div className="rows-header"><h2>Working plans</h2><button type="button" onClick={startNewDbDraft}>Start new set</button></div>''',
              '''          <section className="db-workspace" aria-label="Plans">
            {revisionPlanCount > 0 && <p className="error-summary" role="alert">{revisionPlanCount} conflicting plan{revisionPlanCount === 1 ? "" : "s"} require revision. Open a red-outlined plan to see the conflicting song field{revisionPlanCount === 1 ? "" : "s"}.</p>}
            <div className="rows-header"><h2>Working plans</h2><button type="button" onClick={startNewDbDraft}>Start new set</button></div>''',
              'plans revision alert',
          )
          replace_once(
              '{completedRecords.length === 0 ? <p className="field-help">No completed service records saved yet.</p> : <ul className="saved-set-list">{completedRecords.map((record) =>',
              '{completedRecordsNewestFirst.length === 0 ? <p className="field-help">No completed service records saved yet.</p> : <ul className="saved-set-list history-scroll-list">{completedRecordsNewestFirst.map((record) =>',
              'history order and scroll class',
          )
          replace_once(
              '''            {rows.map((row, index) => {
              return (
                <fieldset className="row-card" key={row.id}''',
              '''            {rows.map((row, index) => {
              const revisionConflict = Boolean(persistedSet?.needsRevision && conflictingRevisionRowIndexes.has(index));
              return (
                <fieldset className={`row-card${revisionConflict ? " needs-revision-row" : ""}`} key={row.id}''',
              'conflicting row class',
          )
          replace_once(
              'onChange={(event) => setSelectedAssignedRole(event.target.value as PlanningRole)}>{storedUser.roles.map((role)',
              'onChange={(event) => selectAssignedRole(event.target.value as PlanningRole)}>{storedUser.roles.map((role)',
              'first role selector',
          )
          replace_once(
              'onChange={(event) => setSelectedAssignedRole(event.target.value as PlanningRole)}>{storedUser.roles.map((role)',
              'onChange={(event) => selectAssignedRole(event.target.value as PlanningRole)}>{storedUser.roles.map((role)',
              'second role selector',
          )

          path.write_text(text)

          css_path = Path('app/globals.css')
          css = css_path.read_text()
          css_marker = '''.needs-revision-message {
  color: var(--danger);
  font-size: 0.875rem;
  font-weight: 700;
  margin: 0.35rem 0.5rem 0.25rem;
}
'''
          if css.count(css_marker) != 1:
              raise SystemExit(f'CSS marker: expected exactly 1 match, found {css.count(css_marker)}')
          css_extra = css_marker + '''
.history-scroll-list {
  max-height: min(24rem, 70vh);
  overflow-y: auto;
  overscroll-behavior: contain;
}

.needs-revision-row {
  border: 2px solid var(--danger);
}

.needs-revision-row .candidate-combobox > input {
