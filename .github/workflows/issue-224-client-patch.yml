name: Issue 224 guarded client patch

on:
  push:
    branches:
      - fix/issue-224-predeploy-conflict-role-history
    paths:
      - .github/workflows/issue-224-client-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-224-predeploy-conflict-role-history
          fetch-depth: 0
      - name: Apply exact guarded patches
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/planning-lifecycle-client.tsx')
          text = path.read_text()

          def replace_once(old: str, new: str, label: str):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
