name: Phase 31.41 protected Production identity bootstrap acceptance

on:
  pull_request:
  push:
    branches:
      - codex/phase-31-41-production-identity-bootstrap

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: organy_app
          POSTGRES_PASSWORD: organy_app
          POSTGRES_DB: organy_phase_31_41
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U organy_app -d organy_phase_31_41"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      ORGANY_RUNTIME: db
      DATABASE_URL: postgres://organy_app:organy_app@127.0.0.1:5432/organy_phase_31_41
      DATABASE_URL_UNPOOLED: postgres://organy_app:organy_app@127.0.0.1:5432/organy_phase_31_41
      BETTER_AUTH_SECRET: phase-31-41-ci-secret-randomized-baseline-0123456789
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund --loglevel=error
      - name: Materialize authoritative Reference catalogs
        run: node data/catalog/materialize-catalogs.mjs
      - name: Database migration
        run: npm run db:migrate
      - name: Establish exact Phase 31.39 Reference baseline
        run: npx tsx scripts/production-reference-sync.ts --apply
      - name: Phase 31.41 protected Production identity bootstrap acceptance
        run: npx tsx scripts/phase-31-41-tests.ts
      - name: Phase 31.40 deployment-boundary regression
        run: npx tsx scripts/phase-31-40-tests.ts
      - name: Typecheck
        run: npm run typecheck
      - name: Complete tests
        run: npm test
      - name: Production build
        run: npm run build