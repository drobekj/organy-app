name: Phase 31.17 compact row UX

on:
  push:
    branches:
      - codex/phase-31-17-inline-melody-detail

permissions:
  contents: write

jobs:
  refine:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/phase-31-17-inline-melody-detail
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund --loglevel=error
      - name: Apply compact-row refinement
        run: python3 scripts/phase-31-17-row-ux-fix.py
      - name: Focused Phase 31.17 acceptance
        run: npm run test:phase-31-17
      - name: Typecheck
        run: npm run typecheck
      - name: Complete tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Commit verified refinement
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            app/globals.css \
            app/planning-lifecycle-client.tsx \
            docs/candidate-selection-knowledge-transfer.md \
            docs/phase-31-17-contract.md \
            scripts/phase-30-1-candidate-flow-tests.ts \
            scripts/phase-31-16-tests.tsx \
            scripts/phase-31-17-tests.tsx \
            scripts/planning-ui-workflow-static-tests.ts \
            src/planning-lifecycle/candidate-flow.ts \
            src/planning-lifecycle/candidate-list.tsx
          git diff --cached --check
          git commit -m "Phase 31.17 — compact invariant Planning rows"
          git push origin HEAD:codex/phase-31-17-inline-melody-detail
