name: Phase 31.17 review correction

on:
  push:
    branches:
      - codex/phase-31-17-inline-melody-detail

permissions:
  contents: write

jobs:
  correct:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/phase-31-17-inline-melody-detail
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund --loglevel=error
      - name: Apply review corrections
        run: python3 scripts/phase-31-17-review-fix.py
      - name: Focused acceptance
        run: npm run test:phase-31-17
      - name: Typecheck
        run: npm run typecheck
      - name: Complete tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Commit verified review corrections
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            app/planning-lifecycle-client.tsx \
            scripts/phase-31-17-tests.tsx \
            scripts/planning-ui-workflow-static-tests.ts \
            src/application/interaction-service.ts \
            src/planning-lifecycle/melody-detail.tsx
          git diff --cached --check
          git commit -m "Phase 31.17 — apply review corrections"
          git push origin HEAD:codex/phase-31-17-inline-melody-detail
