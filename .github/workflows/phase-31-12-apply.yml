name: Phase 31.12 apply

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]' && github.event.pull_request.head.ref == 'codex/phase-31-12-authoritative-candidates'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply Phase 31.12 implementation
        run: |
          set -euo pipefail
          cat .phase-31-12/small-* > /tmp/phase-31-12.patch.gz.b64
          echo "0a408fb3e3af3595adf377ae5c69d736cda0b5e0f2ee526164cb8c12f4dfd1d4  /tmp/phase-31-12.patch.gz.b64" | sha256sum -c -
          base64 -d /tmp/phase-31-12.patch.gz.b64 | gzip -d > /tmp/phase-31-12.patch
          git apply --index /tmp/phase-31-12.patch
          rm -rf .phase-31-12
          rm -f .github/workflows/phase-31-12-apply.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Implement Phase 31.12 authoritative Planning candidates"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
