name: Phase 31.12 apply

on:
  push:
    branches:
      - codex/phase-31-12-authoritative-candidates

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply Phase 31.12 implementation
        run: |
          set -euo pipefail
          cat .phase-31-12/part-* | base64 -d | gzip -d > /tmp/phase-31-12.patch
          git apply --index /tmp/phase-31-12.patch
          rm -rf .phase-31-12
          rm -f .github/workflows/phase-31-12-apply.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Implement Phase 31.12 authoritative Planning candidates"
          git push
