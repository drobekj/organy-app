name: Phase 31.18 restore Phase 31.12 seam

on:
  push:
    branches:
      - codex/phase-31-18-service-context-antiphon-lookup

permissions:
  contents: write

jobs:
  correct:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: organy_app
          POSTGRES_PASSWORD: organy_app
          POSTGRES_DB: organy_app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U organy_app -d organy_app"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://organy_app:organy_app@127.0.0.1:5432/organy_app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/phase-31-18-service-context-antiphon-lookup
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund --loglevel=error
      - name: Restore acceptance seam usage
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/verify-phase-31-12.ts')
          text = path.read_text(encoding='utf-8')
          old_install = '        useInteractionPoolForAcceptance(pool);'
          new_install = '        const restoreInteractionPool = useInteractionPoolForAcceptance(pool);'
          old_restore = '          useInteractionPoolForAcceptance(null);'
          new_restore = '          restoreInteractionPool();'
          if text.count(old_install) != 1 or text.count(old_restore) != 1:
              raise SystemExit('Unexpected Phase 31.12 acceptance seam anchors.')
          path.write_text(text.replace(old_install, new_install).replace(old_restore, new_restore), encoding='utf-8')
          PY
      - name: Verify correction
        run: |
          npm run typecheck
          npm run verify:phase-31-12
      - name: Commit verified fixture correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/verify-phase-31-12.ts
          git commit -m "Phase 31.18 — restore Phase 31.12 acceptance pool seam"
          git push origin HEAD:codex/phase-31-18-service-context-antiphon-lookup
