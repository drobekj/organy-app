name: Phase 31.35 package metadata bootstrap

on:
  push:
    branches:
      - codex/phase-31-35-vercel-neon-runtime-readiness

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Promote runtime pg and pin Node 22
        run: |
          npm pkg set 'dependencies.pg=^8.16.3'
          npm pkg delete 'devDependencies.pg'
          npm pkg set 'engines.node=22.x'
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit synchronized package metadata
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo 'Package metadata already synchronized.'
            exit 0
          fi
          git commit -m 'Prepare production package metadata for Vercel'
          git push
