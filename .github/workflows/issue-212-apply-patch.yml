name: Issue 212 one-time source patch

on:
  push:
    branches:
      - fix/issue-212-acceptance-finalize-completed
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]' && (github.event_name == 'push' || github.head_ref == 'fix/issue-212-acceptance-finalize-completed')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/issue-212-acceptance-finalize-completed
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply narrow source patch
        run: node scripts/issue-212-apply-patch.mjs
      - name: Install dependencies
        run: npm ci --no-audit --no-fund --loglevel=error
      - name: Acceptance regression
        run: npx tsx scripts/issue-212-acceptance-tests.ts
      - name: Typecheck
        run: npm run typecheck
      - name: Commit verified patch and remove bootstrap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/issue-212-apply-patch.yml scripts/issue-212-apply-patch.mjs
          git add app/planning-lifecycle-client.tsx
          git commit -m "fix: finalize current edits and unblock completed history"
          git push origin HEAD:fix/issue-212-acceptance-finalize-completed
