name: Phase 31.12 automatic review fixes

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]' && github.event.pull_request.head.ref == 'codex/phase-31-12-authoritative-candidates'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply review fixes
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          service = Path("src/application/reference-candidate-service.ts")
          text = service.read_text()
          old = '''    return {
                ...toCandidate(stored, equivalents, antiphonMatch, false),
                orderKey: `hydrated:${stored.language}:${String(stored.canonicalNumber).padStart(8, "0")}:${stored.id}`,
              };'''
          new = '''    return {
                ...toCandidate(stored, equivalents, antiphonMatch, false),
                number: reference.number,
                title: reference.title ?? stored.title,
                orderKey: `hydrated:${stored.language}:${String(stored.canonicalNumber).padStart(8, "0")}:${stored.id}`,
              };'''
          if old not in text:
              raise SystemExit("hydration return block not found")
          service.write_text(text.replace(old, new, 1))

          client = Path("app/planning-lifecycle-client.tsx")
          text = client.read_text()
          old = 'useEffect(() => { lookupTracker.invalidatePrefix("song:"); setCandidateResults({}); }, [runtimeMode, serviceContextRecordKey, organistId, referenceAntiphon?.id, serviceLanguage, lookupTracker]);'
          new = 'useEffect(() => { lookupTracker.invalidatePrefix("song:"); setCandidateResults({}); }, [runtimeMode, serviceContextRecordKey, organistId, referenceAntiphon?.id, serviceLanguage, serviceDate, lookupTracker]);'
          if old not in text:
              raise SystemExit("candidate invalidation effect not found")
          text = text.replace(old, new, 1)
          old = 'const requestIdentity = [runtimeMode, serviceContextRecordKey, languageAtRequest, organistId ?? "", referenceAntiphon?.id ?? "", value].join("|");'
          new = 'const requestIdentity = [runtimeMode, serviceContextRecordKey, serviceDate, languageAtRequest, organistId ?? "", referenceAntiphon?.id ?? "", value].join("|");'
          if old not in text:
              raise SystemExit("candidate request identity not found")
          client.write_text(text.replace(old, new, 1))

          route = Path("app/api/interaction/route.ts")
          text = route.read_text()
          text = text.replace('typeof input.serviceDate !== "string" || !ISO_DATE.test(input.serviceDate) || !Number.isFinite(Date.parse(`${input.serviceDate}T00:00:00Z`))', 'typeof input.serviceDate !== "string" || !isValidIsoDate(input.serviceDate)', 1)
          text = text.replace('typeof usage.serviceDate !== "string" || !ISO_DATE.test(usage.serviceDate)', 'typeof usage.serviceDate !== "string" || !isValidIsoDate(usage.serviceDate)', 1)
          marker = '''function validateOptionalString(input: Record<string, unknown>, key: string): void {
          '''
          helper = '''function isValidIsoDate(value: string): boolean {
            if (!ISO_DATE.test(value)) return false;
            const [year, month, day] = value.split("-").map(Number);
            const date = new Date(Date.UTC(year, month - 1, day));
            return date.getUTCFullYear() === year && date.getUTCMonth() === month - 1 && date.getUTCDate() === day;
          }
+
          function validateOptionalString(input: Record<string, unknown>, key: string): void {
          '''.replace("+\n", "\n")
          if marker not in text:
              raise SystemExit("route helper insertion marker not found")
          route.write_text(text.replace(marker, helper, 1))

          unit = Path("scripts/phase-31-12-tests.tsx")
          text = unit.read_text()
          text = text.replace('assert.equal(hydrated[0].title, "Authoritative Alpha");\n  assert.equal(hydrated[0].number, "1");', 'assert.equal(hydrated[0].title, "Historical title");\n  assert.equal(hydrated[0].number, "OLD");', 1)
          unit.write_text(text)

          verify = Path("scripts/verify-phase-31-12.ts")
          text = verify.read_text()
          text = text.replace('assert.equal(hydrated.body.value[0].title, "Phase 31.12 Authoritative Candidate");\n  assert.equal(hydrated.body.value[0].signal, "antiphon");', 'assert.equal(hydrated.body.value[0].title, "Historical");\n  assert.equal(hydrated.body.value[0].number, "OLD");\n  assert.equal(hydrated.body.value[0].aggregatePreferenceScore, 3);\n  assert.equal(hydrated.body.value[0].signal, "antiphon");', 1)
          text = text.replace('{ ...baseQuery(), serviceLanguage: "english" },', '{ ...baseQuery(), serviceLanguage: "english" },\n    { ...baseQuery(), serviceDate: "2026-02-31" },', 1)
          verify.write_text(text)
          PY
          rm -f .github/workflows/phase-31-12-review-fixes.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Fix Phase 31.12 historical hydration and candidate context identity"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
