name: Apply Phase 31.15 implementation

on:
  push:
    branches:
      - codex/phase-31-15-melody-occupancy-collisions

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: codex/phase-31-15-melody-occupancy-collisions
      - name: Apply exact Phase 31.15 patch
        run: |
          set -euo pipefail
          cat .phase-31-15-patch-00 .phase-31-15-patch-01 .phase-31-15-patch-02 .phase-31-15-patch-03 \
            | base64 --decode \
            | gzip --decompress \
            > /tmp/phase-31-15.patch
          git apply --index /tmp/phase-31-15.patch
          rm .phase-31-15-payload.b64
          rm .phase-31-15-patch-00 .phase-31-15-patch-01 .phase-31-15-patch-02 .phase-31-15-patch-03
          rm .github/workflows/phase-31-15-source-snapshot.yml
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: implement Phase 31.15 melody occupancy and collisions"
          git push origin HEAD:codex/phase-31-15-melody-occupancy-collisions
