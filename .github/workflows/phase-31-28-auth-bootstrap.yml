name: Phase 31.28 auth schema bootstrap

on:
  push:
    branches:
      - codex/phase-31-28-protected-staff-auth
    paths:
      - .github/workflows/phase-31-28-auth-bootstrap.yml

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/phase-31-28-protected-staff-auth
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: node scripts/phase-31-28-auth-bootstrap.mjs
      - name: Commit generated auth baseline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Generate Phase 31.28 Better Auth baseline"
          git push origin HEAD:codex/phase-31-28-protected-staff-auth
      # retry 2: Drizzle versions aligned to Better Auth 1.6.25 peer requirements
