name: Issue 259 Audit History polish acceptance

on:
  pull_request:
    paths:
      - app/admin/audit-history/page.tsx
      - app/issue-253-audit-history.css
      - src/application/audit-history-view.ts
      - scripts/issue-253-tests.ts
      - scripts/issue-259-tests.ts
      - package.json
      - .github/workflows/issue-259.yml
  workflow_dispatch:

jobs:
  issue-259:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund --loglevel=error
      - name: Issue 259 polish acceptance
        run: npm run test:issue-259
      - run: npm run typecheck
      - run: npm test
      - name: Production build
        run: npm run build
