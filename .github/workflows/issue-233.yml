name: Issue 233 live Working conflict acceptance

on:
  pull_request:
    paths:
      - app/api/planning-lifecycle/route.ts
      - app/globals.css
      - app/planning-lifecycle-client.tsx
      - src/planning-lifecycle/candidate-list.tsx
      - src/planning-lifecycle/conflict-ui.ts
      - scripts/issue-224-tests.ts
      - scripts/issue-230-tests.ts
      - scripts/issue-233-tests.ts
      - .github/workflows/issue-233.yml
  workflow_dispatch:

jobs:
  issue-233:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: organy_issue_233
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d organy_issue_233"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/organy_issue_233
      ORGANY_RUNTIME: db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - name: Issue 224 regression
        run: npx tsx scripts/issue-224-tests.ts
      - name: Issue 230 regression
        run: npx tsx scripts/issue-230-tests.ts
      - name: Issue 233/235 UI state acceptance
        run: npx tsx scripts/issue-233-tests.ts
      - run: npm run typecheck
      - run: npm test